[workspace]
resolver = "2"
members = [
  "crates/todo-core",
  "crates/todo-store",
  "crates/todo-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cid = "0.11"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
minicbor = { version = "0.26", features = ["std"] }
multihash = "0.19"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
turso = "=0.8.0-pre.7"
uuid = { version = "1.18", features = ["v7", "serde"] }

[workspace.lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
