<div id="todo-gui-prototype" aria-label="Todo ledger native graph editor prototype">
  <style>
    #todo-gui-prototype { color: light-dark(#182321, #e9f0ed); font-family: ui-sans-serif, system-ui, sans-serif; }
    #todo-gui-prototype * { box-sizing: border-box; }
    #todo-gui-prototype .shell { background: light-dark(#f7faf8, #111a18); border: 1px solid light-dark(#c8d3ce, #344841); border-radius: 12px; overflow: hidden; }
    #todo-gui-prototype .topbar { align-items: center; background: light-dark(#eaf1ed, #172521); border-bottom: 1px solid light-dark(#c8d3ce, #344841); display: flex; gap: 12px; justify-content: space-between; padding: 12px 16px; }
    #todo-gui-prototype h2, #todo-gui-prototype h3, #todo-gui-prototype p { margin: 0; }
    #todo-gui-prototype h2 { font-size: 16px; font-weight: 500; }
    #todo-gui-prototype h3 { font-size: 13px; font-weight: 500; }
    #todo-gui-prototype .subtle { color: light-dark(#53675f, #adc0b8); font-size: 12px; }
    #todo-gui-prototype .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 470px; }
    #todo-gui-prototype .canvas { background: light-dark(#f3f7f4, #0e1715); min-height: 470px; padding: 18px; position: relative; }
    #todo-gui-prototype .canvas-head { align-items: center; display: flex; justify-content: space-between; margin-bottom: 12px; }
    #todo-gui-prototype .tabs { display: flex; gap: 4px; }
    #todo-gui-prototype button { background: light-dark(#ffffff, #1c2a26); border: 1px solid light-dark(#b9c9c1, #40564e); border-radius: 6px; color: inherit; cursor: pointer; font: inherit; font-size: 12px; padding: 7px 9px; }
    #todo-gui-prototype button[aria-pressed="true"] { background: light-dark(#176b4d, #4bc98a); border-color: transparent; color: light-dark(#ffffff, #102018); }
    #todo-gui-prototype .board { background-image: radial-gradient(light-dark(#ccd8d2, #2b3d36) 1px, transparent 1px); background-size: 18px 18px; border: 1px solid light-dark(#ccd8d2, #32463e); height: 390px; overflow: hidden; position: relative; }
    #todo-gui-prototype svg { height: 100%; left: 0; position: absolute; top: 0; width: 100%; }
    #todo-gui-prototype .edge { fill: none; stroke: light-dark(#8a9b93, #71847b); stroke-width: 2; }
    #todo-gui-prototype .edge.hierarchy { stroke-dasharray: 6 5; }
    #todo-gui-prototype .edge.blocker { marker-end: url(#todo-gui-arrow); }
    #todo-gui-prototype .node { background: light-dark(#ffffff, #1b2925); border: 1px solid light-dark(#9db1a7, #4d6b5e); border-radius: 8px; box-shadow: 0 2px 5px light-dark(#17302620, #00000033); cursor: pointer; padding: 10px; position: absolute; text-align: left; width: 150px; }
    #todo-gui-prototype .node.active { border-left: 4px solid light-dark(#16895f, #58d99b); }
    #todo-gui-prototype .node.done { opacity: .65; text-decoration: line-through; }
    #todo-gui-prototype .node.selected { outline: 3px solid light-dark(#e6a744, #f2bb5b); }
    #todo-gui-prototype .node small { display: block; font-size: 11px; margin-top: 5px; opacity: .7; }
    #todo-gui-prototype .node-a { left: 7%; top: 54px; }
    #todo-gui-prototype .node-b { left: 37%; top: 166px; }
    #todo-gui-prototype .node-c { left: 68%; top: 64px; }
    #todo-gui-prototype .node-d { left: 69%; top: 264px; }
    #todo-gui-prototype .legend { display: flex; flex-wrap: wrap; font-size: 11px; gap: 12px; margin-top: 10px; }
    #todo-gui-prototype .legend span { align-items: center; display: inline-flex; gap: 5px; }
    #todo-gui-prototype .line { display: inline-block; height: 2px; width: 22px; background: light-dark(#8a9b93, #71847b); }
    #todo-gui-prototype .line.hierarchy { background: repeating-linear-gradient(90deg, light-dark(#8a9b93, #71847b) 0 6px, transparent 6px 10px); }
    #todo-gui-prototype .inspector { background: light-dark(#ffffff, #16231f); border-left: 1px solid light-dark(#c8d3ce, #344841); padding: 16px; }
    #todo-gui-prototype .selection { border-bottom: 1px solid light-dark(#d8e1dc, #344841); padding-bottom: 12px; }
    #todo-gui-prototype .selection-row { align-items: center; display: flex; gap: 8px; justify-content: space-between; margin: 8px 0 0; }
    #todo-gui-prototype textarea { background: light-dark(#f7faf8, #0d1513); border: 1px solid light-dark(#aebfb6, #42584f); border-radius: 6px; color: inherit; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 12px; min-height: 190px; padding: 10px; resize: vertical; width: 100%; }
    #todo-gui-prototype .validation { font-size: 12px; min-height: 20px; padding-top: 8px; }
    #todo-gui-prototype .valid { color: light-dark(#147046, #67d99f); }
    #todo-gui-prototype .invalid { color: light-dark(#a62d2d, #ff9a91); }
    #todo-gui-prototype .actions { display: flex; gap: 8px; margin-top: 10px; }
    #todo-gui-prototype .actions button:first-child { background: light-dark(#176b4d, #4bc98a); border-color: transparent; color: light-dark(#ffffff, #102018); }
    @media (max-width: 700px) { #todo-gui-prototype .workspace { grid-template-columns: 1fr; } #todo-gui-prototype .inspector { border-left: 0; border-top: 1px solid light-dark(#c8d3ce, #344841); } }
  </style>
  <section class="shell">
    <header class="topbar"><div><h2>Todo ledger</h2><p class="subtle">Research project · local ledger</p></div><button type="button">New task</button></header>
    <div class="workspace">
      <main class="canvas">
        <div class="canvas-head"><h3>Work graph</h3><div class="tabs" role="group" aria-label="Relationship overlay"><button type="button" data-overlay="combined" aria-pressed="true">Combined</button><button type="button" data-overlay="hierarchy" aria-pressed="false">Hierarchy</button><button type="button" data-overlay="blockers" aria-pressed="false">Blockers</button></div></div>
        <div class="board" aria-label="Task graph; select a task to edit it">
          <svg viewBox="0 0 700 390" aria-hidden="true"><defs><marker id="todo-gui-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="currentColor"></path></marker></defs><path class="edge hierarchy" data-edge="hierarchy" d="M150 108 C235 108 230 201 300 201"></path><path class="edge hierarchy" data-edge="hierarchy" d="M446 201 C510 201 495 120 550 120"></path><path class="edge blocker" data-edge="blockers" d="M150 110 C310 350 475 330 550 318"></path></svg>
          <button type="button" class="node node-a" data-node="Plan literature review" data-state="active" data-priority="high">Plan literature review<small>active · high</small></button>
          <button type="button" class="node node-b selected active" data-node="Find three anchor papers" data-state="active" data-priority="normal">Find three anchor papers<small>active · normal</small></button>
          <button type="button" class="node node-c" data-node="Read anchor paper" data-state="inbox" data-priority="normal">Read anchor paper<small>inbox · normal</small></button>
          <button type="button" class="node node-d done" data-node="Confirm library access" data-state="done" data-priority="normal">Confirm library access<small>done · normal</small></button>
        </div>
        <div class="legend"><span data-legend="hierarchy"><i class="line hierarchy"></i> parent → child</span><span data-legend="blockers"><i class="line"></i> blocker → blocked task</span></div>
      </main>
      <aside class="inspector" aria-live="polite"><div class="selection"><h3 id="selected-title">Find three anchor papers</h3><div class="selection-row"><span class="subtle" id="selected-meta">active · normal</span><button id="complete" type="button">Complete</button></div></div><label class="subtle" for="raw-item">Editable task record</label><textarea id="raw-item" aria-label="Editable task record">title: Find three anchor papers
state: active
priority: normal
tags:
  - topic/research
  - goal/research/preprint</textarea><div id="validation" class="validation valid">✓ Parsed successfully — ready to save</div><div class="actions"><button id="save" type="button">Save changes</button><button id="discard" type="button">Discard</button></div></aside>
    </div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('todo-gui-prototype');
      const raw = root.querySelector('#raw-item');
      const validation = root.querySelector('#validation');
      const title = root.querySelector('#selected-title');
      const meta = root.querySelector('#selected-meta');
      let selected = { title: 'Find three anchor papers', state: 'active', priority: 'normal' };
      const renderRecord = () => { raw.value = `title: ${selected.title}\nstate: ${selected.state}\npriority: ${selected.priority}\ntags:\n  - topic/research\n  - goal/research/preprint`; title.textContent = selected.title; meta.textContent = `${selected.state} · ${selected.priority}`; };
      const validate = () => { const lines = raw.value.split('\n'); const parsed = Object.fromEntries(lines.filter(line => /^(title|state|priority): /.test(line)).map(line => line.split(': ').map(x => x.trim()))); const ok = parsed.title && ['inbox','active','done','canceled'].includes(parsed.state) && ['low','normal','high','critical'].includes(parsed.priority); validation.textContent = ok ? '✓ Parsed successfully — ready to save' : 'Parse error: title, state, and priority need valid values'; validation.className = `validation ${ok ? 'valid' : 'invalid'}`; return parsed; };
      raw.addEventListener('input', validate);
      root.querySelector('#save').addEventListener('click', () => { const parsed = validate(); if (validation.classList.contains('valid')) { selected = parsed; renderRecord(); validation.textContent = '✓ Saved as one validated ledger update'; } });
      root.querySelector('#discard').addEventListener('click', renderRecord);
      root.querySelector('#complete').addEventListener('click', () => { selected.state = selected.state === 'done' ? 'active' : 'done'; root.querySelector('#complete').textContent = selected.state === 'done' ? 'Reopen' : 'Complete'; renderRecord(); });
      root.querySelectorAll('.node').forEach(node => node.addEventListener('click', () => { root.querySelectorAll('.node').forEach(n => n.classList.remove('selected')); node.classList.add('selected'); selected = { title: node.dataset.node, state: node.dataset.state, priority: node.dataset.priority }; root.querySelector('#complete').textContent = selected.state === 'done' ? 'Reopen' : 'Complete'; renderRecord(); }));
      root.querySelectorAll('[data-overlay]').forEach(button => button.addEventListener('click', () => { const overlay = button.dataset.overlay; root.querySelectorAll('[data-overlay]').forEach(b => b.setAttribute('aria-pressed', String(b === button))); root.querySelectorAll('[data-edge]').forEach(edge => edge.style.display = overlay === 'combined' || edge.dataset.edge === overlay ? '' : 'none'); root.querySelectorAll('[data-legend]').forEach(item => item.style.display = overlay === 'combined' || item.dataset.legend === overlay ? '' : 'none'); }));
    })();
  </script>
</div>
